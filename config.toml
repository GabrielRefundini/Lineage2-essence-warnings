# Agenda de eventos do jogo — L2 Party Scanner
#
# ESTE ARQUIVO E SEU. Edite a vontade; nada no scanner escreve nele.
# (Ao contrario do calibration.json, que o calibrar.bat sobrescreve — e por
# isso os horarios moram aqui e nao la.)
#
# OS HORARIOS MUDAM COM ATUALIZACAO DO JOGO. Quando mudarem, corrija aqui.
# Nunca e preciso mexer em codigo.
#
# Campos de cada [[evento]]:
#
#   nome                  como o evento aparece na mensagem do WhatsApp
#   horarios              lista em "HH:MM", 24 horas
#   dias                  seg ter qua qui sex sab dom (fora = todo dia)
#   avisar_minutos_antes  quanto antes mandar o primeiro aviso
#   chamar_minutos_antes  quanto antes perguntar no grupo quem vai (0 = nunca)
#   silenciar_minutos     quanto tempo calar os alertas depois que comeca
#
# Cada evento gera ATE TRES avisos:
#
#   1. `chamar_minutos_antes` do horario: "quem vai?" — so se voce pedir,
#      apagando ou zerando a linha o evento nunca chama ninguem;
#   2. `avisar_minutos_antes` do horario: para parar o farm e se deslocar;
#   3. no horario: dizendo que comecou (`avisar_no_horario = false` desliga).

[[evento]]
nome = "TvT"
horarios = ["15:00", "17:00", "19:30", "21:50", "23:00"]
dias = ["seg", "ter", "qua", "qui", "sex", "sab", "dom"]
avisar_minutos_antes = 10
silenciar_minutos = 15

[[evento]]
nome = "Prime"
horarios = ["20:00"]
dias = ["seg", "ter", "qua", "qui"]
avisar_minutos_antes = 10
# Duas horas. De segunda a quinta esta janela engole o TvT das 21:50, cuja
# propria janela vai ate 22:05 — o silencio termina as 22:05, nao as 22:00.
silenciar_minutos = 120

# Solo Boss nasce de duas em duas horas, sempre em horario par.
#
# So o aviso de ANTECEDENCIA (avisar_no_horario = false). Sao 12 ocorrencias
# por dia; com dois avisos cada seriam 24 mensagens no grupo, tres vezes o
# volume de TvT e Prime somados. Se quiser os dois avisos, troque para true.
#
# 110 minutos de chamada NAO e um numero solto: com o boss de duas em duas
# horas, 1h50 antes cai dez minutos DEPOIS do boss anterior — o unico momento
# do ciclo em que a party ainda esta reunida e ainda esta olhando o WhatsApp.
# Isso soma 12 mensagens por dia no grupo, uma por ocorrencia. Se nao valer a
# pena, apague a linha `chamar_minutos_antes` e nada mais muda.
#
# Nao silencia nada: boss solo nao enche a party de mortes como um TvT.
#
# Se os avisos de madrugada incomodarem, e so apagar os horarios da lista —
# nada mais precisa mudar.
#
# PARA CALAR ESTE EVENTO SEM EDITAR NADA AQUI: mande /desativarsoloboss no
# WhatsApp. Ele desliga os DOIS avisos abaixo de uma vez (tudo ou nada, de
# proposito) e continua desligado depois de reiniciar o scanner — nada religa
# sozinho, so o /ativarsoloboss. Enquanto estiver assim, o /status diz. Estas
# duas linhas continuam sendo a configuracao; o comando so as suspende.
#
# PARA PARAR SO DE MONTAR GRUPO, SEM CALAR O BOSS: mande /desativarlista. E a
# chave FINA, e a diferenca entre as duas e o unico jeito de voce desligar a
# coisa errada, entao ela esta escrita aqui do lado:
#
#   /desativarsoloboss  cala o evento INTEIRO — nem a chamada de 1h50, nem o
#                       lembrete de 10 minutos. Voce para de saber do boss.
#   /desativarlista     para so de MONTAR GRUPO — cai a chamada "Quem vai?",
#                       caem /entrar e /sair, a lista deixa de fechar quando o
#                       boss nasce e /loot-<nick> para de designar. O LEMBRETE
#                       DE 10 MINUTOS CONTINUA CHEGANDO.
#
# Use a segunda quando a party parar de fazer Solo Boss e voce ainda quiser
# saber que ele vai nascer. O historico de loot (/pegou, /corrigir, /<nick>)
# fica inteiro nas duas: desligar nao apaga o passado.
#
# As duas sao independentes — nenhuma contem a outra —, nao voltam sozinhas nem
# reiniciando, e o /status nomeia as duas separadamente. Religam com
# /ativarsoloboss e /ativarlista, cada uma com o seu.
[[evento]]
nome = "Solo Boss"
horarios = [
  "00:00", "02:00", "04:00", "06:00", "08:00", "10:00",
  "12:00", "14:00", "16:00", "18:00", "20:00", "22:00",
]
avisar_minutos_antes = 10
avisar_no_horario = false
chamar_minutos_antes = 110
silenciar_minutos = 0

# ---------------------------------------------------------------------------
# Quem pode dar /entrar e /sair — os [[membro]] da party
#
# Cada bloco [[membro]] liga um telefone do WhatsApp a um nick do jogo. Quem
# estiver aqui pode mandar SO ISTO no scanner:
#
#   /entrar (/join)    entra na lista do proximo Solo Boss
#   /sair   (/leave)   sai da lista
#
# E MAIS NADA. Um [[membro]] NAO alcanca /cancelar, /solo, /party, /status,
# nem nenhum comando de loot — em especial /corrigir e /pegou, que reescrevem
# a estatistica de quem pegou o que e nao tem como voltar atras. Esses
# continuam so para os numeros de CHATWOOT_TELEFONES_COMANDO, no .env.
#
# NEM /desativarsoloboss, /desativarlista E OS PARES DE RELIGAR. Ficam de fora
# de proposito: eles mudam o que a party INTEIRA recebe por tempo
# indeterminado, e o efeito e a AUSENCIA de mensagem — do lado dos outros,
# indistinguivel do bot ter caido. Um party-mate podia desligar a lista de
# presenca de todos os outros.
#
# ATENCAO: isso vale enquanto CHATWOOT_TELEFONES_COMANDO tiver pelo menos um
# numero. Com a variavel VAZIA, o scanner aceita comando de QUALQUER remetente
# das conversas configuradas — membro ou nao — e ai nao ha contencao nenhuma,
# inclusive para /corrigir e /pegou. O arranque grita quando esta nesse estado.
#
# O nick e o do JOGO, e e ele que aparece na lista de presenca. O nome que o
# WhatsApp mostra nao serve: ele e escrito pelo dono do telefone e muda quando
# a pessoa quer.
#
# Dois [[membro]] nao podem ter o mesmo nick: a lista de presenca e indexada
# por ele, e os dois dividiriam a mesma vaga. O arranque recusa.
#
# Telefone com ou sem o 9, com ou sem +55, tanto faz — a comparacao e pelos
# ultimos 8 digitos, e o numero precisa ter pelo menos esses 8. Justamente por
# isso, NAO ponha dois numeros que terminem nos mesmos 8 digitos. Se um deles
# for de CHATWOOT_TELEFONES_COMANDO e o outro de um [[membro]], aquele
# party-mate alcancaria TODOS os comandos — entao o scanner NAO SOBE ate voce
# desambiguar. Entre dois numeros do mesmo nivel ele so avisa alto.
#
# ONDE ESCREVER OS SEUS: no `config.local.toml`, NAO aqui.
#
# Copie o `config.local.exemplo.toml` para `config.local.toml` e ponha os
# blocos la. Aquele arquivo esta no .gitignore; este aqui e versionado, e o
# telefone de um party-mate e de OUTRA PESSOA — numero que entra em historico
# de git nao sai mais, nem apagando depois.
#
# Este arquivo continua versionado por causa da agenda: os `[[evento]]` la de
# cima tem teste lendo o arquivo DO REPOSITORIO, porque um horario errado de
# TvT deixa a party esperando um evento que nao vai acontecer.
#
# Com `config.local.toml` presente e com bloco, os `[[membro]]` daqui sao
# IGNORADOS — vale um arquivo ou o outro, nunca a soma. Deixando bloco nos
# dois, o arranque avisa alto e diz qual venceu.
#
# O exemplo abaixo fica comentado de proposito: o arquivo do repositorio nao
# carrega telefone de ninguem.
#
# [[membro]]
# nick = "Korzis"
# telefone = "+5544999998888"
#
# [[membro]]
# nick = "J4guar"
# telefone = "+5544977776666"

# ---------------------------------------------------------------------------
# QUAL CLIENTE A CALIBRACAO DEVE MIRAR — para quem roda dois ao mesmo tempo
#
# O PROBLEMA: com DOIS clientes abertos, o calibrar.bat capturava a tela
# inteira e procurava as barras da party em TODA a imagem. Com duas party
# windows visiveis ele consegue juntar barras dos DOIS clientes e deduzir uma
# geometria que nao e de nenhum — e grava isso sem reclamar, porque cada passo
# dele pareceu dar certo. O erro que grita voce conserta; este voce so descobre
# quando o alerta nao chega.
#
# Preenchendo a chave abaixo, a calibracao le SO a janela daquele personagem.
# Os pixels do outro cliente nunca entram na conta.
#
# SEM ESTA CHAVE NADA MUDA. Quem tem um cliente so nao precisa dela: o
# calibrar.bat continua funcionando exatamente como sempre funcionou.
#
# SE A CHAVE APONTAR PARA UMA JANELA QUE NAO EXISTE — jogo fechado, personagem
# trocado, cliente ainda na tela de login — a ferramenta RECUSA, mostra as
# janelas do jogo que encontrou e para. Ela nao volta a varrer a tela: voltar
# seria trazer de novo exatamente o problema que esta chave existe para fechar.
#
# ESCREVA O NOME DO PERSONAGEM, e nao o titulo inteiro da janela. Jogando, o
# titulo e "Yazalaque - XM Essence"; na tela de login ele encolhe para so
# "XM Essence". Uma chave com o titulo inteiro nao casaria nada nesse estado, e
# a recusa diria "nao achei essa janela" quando a verdade e "seu cliente ainda
# esta no login".
#
# NA LINHA DE COMANDO, --janela "TITULO EXATO" VENCE esta chave. E a saida de
# emergencia quando voce quer calibrar o outro cliente sem editar arquivo.
#
# ESTA CHAVE DIRIGE A CALIBRACAO, nao o scanner. O vigiar-party.bat aprende a
# janela pelo calibration.json que a calibracao grava.
#
# ISTO NAO E SEGREDO: e um nome publico dentro do jogo, entao pode morar neste
# arquivo versionado — ao contrario dos telefones ali de cima. Quem preferir
# pode escrever no config.local.toml, que vence este aqui; com a chave nos dois
# o arranque avisa alto e diz qual venceu.
#
# O exemplo abaixo fica comentado de proposito: o arquivo do repositorio nao
# carrega o personagem de ninguem.
#
# [jogo]
# personagem = "Yazalaque"

# ---------------------------------------------------------------------------
# Watchlist do WORLD EXCHANGE — quais itens acompanhar no mercado
#
# CONJUNTO FECHADO, de proposito. O scanner nao le nome de item na tela: ele
# compara o recorte com um molde cortado da SUA gravacao, um por item desta
# lista. Item que nao esta aqui nao e lido, e isso e a decisao D-05.
#
# ESCREVA O NOME COMO ELE APARECE NA TELA, com o prefixo de encanto quando
# houver. Cada variante de encanto e uma LINHA SEPARADA, porque cada uma e uma
# serie de precos independente — medido numa unica pagina real, o mesmo item
# base valia de 7,02 a 100,00 conforme o encanto. Misturar `+3` e `+4` na mesma
# serie nao acrescenta ruido: destroi a serie.
#
# O item SEM encanto nao escreve `+0` — ele nao escreve prefixo nenhum.
#
# Depois de editar esta lista, rode o calibrar-mercado.bat: ele pede um recorte
# para cada item e RECUSA se dois deles se confundirem, dizendo qual par.
#
# Sem esta secao a calibracao roda igual: ela grava as ancoras e a grade, e diz
# alto que nao cortou molde de nome nenhum.
#
# [mercado]
# watchlist = [
#   "Dragon Belt",
#   "+3 Dragon Belt",
#   "+4 Dragon Belt",
# ]

# ---------------------------------------------------------------------------
# PONTE DO DISCORD — repetir anuncio de guild no WhatsApp
#
# Esta secao e de OUTRO programa: o ponte-discord.bat. O vigiar-party.bat nao
# le nada daqui, e a ponte nao le nada do resto do arquivo. Os dois so dividem
# o mesmo .venv e este mesmo config.toml.
#
# AO CONTRARIO da agenda, esta secao NAO PODE FALTAR. A agenda e um acessorio
# de um scanner que roda sem ela; a ponte e um programa dedicado que nao tem o
# que fazer sem saber quais canais ouvir. Apagar uma chave daqui faz a ponte
# MORRER no arranque dizendo qual chave falta — de proposito, porque subir muda
# seria pior: voce ficaria olhando um console vivo esperando um anuncio que
# nunca poderia chegar.
#
# O TOKEN DO BOT NAO ENTRA AQUI. Ele mora no .env, que esta no .gitignore.
# Este arquivo e versionado e e o que voce fotografa quando pede ajuda.
#
# Antes do primeiro uso, faca os 4 passos do PORTAO-DISCORD.txt.
#
# Campos:
#
#   guild                 o id do servidor do Discord (XM Games)
#   canais                os ids dos canais a ouvir. Mensagem de QUALQUER outro
#                         canal do servidor e ignorada. Id de thread tambem nao
#                         passa, porque thread tem id proprio.
#   conversa_de_destino   para qual conversa do Chatwoot os anuncios vao
#   simulacao             true = so mostra no console, nao envia nada
#
# Para ver os ids no Discord: Configuracoes do usuario > Avancado > Modo de
# desenvolvedor ligado; depois clique com o botao direito no servidor ou no
# canal e escolha "Copiar ID".

[discord]
guild = 936957935572103169
canais = [1536506379752185953, 1538202612762022020]

# Descubra o id rodando, nesta pasta:
#     .venv\Scripts\python.exe tools\check_whatsapp.py conversas
# NAO use uma conversa que ja esteja em CHATWOOT_CONVERSAS_COMANDO no .env:
# aquela e a conversa de onde o scanner ACEITA COMANDO, e despejar anuncio de
# guild nela mistura duas coisas que precisam ficar separadas.
# Na Fase 1 pode ficar vazio: a ponte so simula, nao entrega nada ainda.
conversa_de_destino = ""

# Na Fase 1 a ponte SO SIMULA: ela mostra a mensagem no console e nao manda
# nada para o WhatsApp. Deixe true ate o texto de verdade aparecer no console.
simulacao = true

# ---------------------------------------------------------------------------
# Os bosses raros vigiados no chat e no alvo — L2 Party Scanner
#
# O scanner avisa no WhatsApp quando o SERVIDOR anuncia o nascimento de um
# destes mobs no chat do jogo, ou quando o nome de um deles aparece no seu
# alvo selecionado.
#
# ACRESCENTAR UM MOB E ACRESCENTAR UM BLOCO AQUI. Nunca e preciso mexer em
# codigo: o scanner nao conhece mob nenhum por nome, ele so le esta lista.
#
# Campos de cada [[boss]]:
#
#   nome                como o mob aparece no jogo, do jeito exato. E este
#                       nome que vai para a mensagem do WhatsApp — o texto
#                       que o OCR leu nunca vai.
#   respawn_horas_min   quantas horas, no minimo, o servidor demora para
#                       renascer o mob depois da morte dele
#   respawn_horas_max   o limite otimista da mesma janela
#
# AS HORAS DE RESPAWN AINDA NAO FAZEM NADA. Sao lidas e conferidas desde ja
# (um valor torto derruba o arranque dizendo qual campo esta errado), mas
# quem as usa e a Fase 2, que vai prever a janela do proximo nascimento.
# Estao aqui agora para voce nao ter que editar este arquivo duas vezes.
#
# A regra do servidor para o Tiat: 8 horas fixas, mais 0 a 2 horas
# aleatorias, contadas a partir da MORTE.
#
# EM VIGOR desde a manutencao de 31/08/2026, confirmada pelo usuario. Antes
# dela eram 6 horas fixas mais ate 4 aleatorias, e os intervalos medidos
# naquele regime foram 6.13h, 7.83h, 8.08h e 8.10h.
#
# MEDIDO EM CAMPO EM 31/08, e por isso este comentario existe: com 8 aqui, o
# scanner ficou MUDO em dois nascimentos de verdade. A janela anti-repeticao
# saia deste mesmo numero, e um minimo alto demais classificou nascimento novo
# como deteccao repetida do anterior. Os intervalos reais entre nascimentos
# foram 6.13h, 7.83h, 8.08h e 8.10h — e 6.13h prova sozinho que o minimo nao
# podia ser 8, porque a conta parte da MORTE e a morte vem depois do
# nascimento, entao nascimento-a-nascimento nunca fica abaixo do minimo.
#
# CONFIRA os intervalos medidos depois de alguns nascimentos no regime novo:
# se aparecer um intervalo nascimento-a-nascimento MENOR que 8 horas, entao o
# minimo real nao e 8, e este numero esta errado de novo. Foi assim que o
# valor anterior foi desmascarado.
#
# SEM NENHUM BLOCO, o scanner sobe normalmente e so avisa no console que a
# vigilancia de boss esta desligada.

[[boss]]
nome = "Tiat North"
respawn_horas_min = 8
respawn_horas_max = 10

[[boss]]
nome = "Tiat South"
respawn_horas_min = 8
respawn_horas_max = 10

# ---------------------------------------------------------------------------
# QUANTOS MINUTOS DE DETECCOES SAO O MESMO NASCIMENTO ([episodio])
#
# O scanner ve o MESMO nascimento varias vezes: a linha do servidor fica no
# chat por minutos, o boss fica no seu alvo, voce desmarca e remarca. Sem uma
# regra, cada uma dessas leituras viraria uma mensagem no grupo (em 30/08/2026
# um unico nascimento rendeu SEIS). Este numero e a resposta: deteccoes do
# mesmo boss dentro desta janela contam como UM nascimento e rendem UMA
# mensagem.
#
# NAO E A MESMA COISA QUE `respawn_horas_min`, E ESSA SEPARACAO CUSTOU CARO.
# Ate 31/08/2026 este valor era calculado a partir do respawn, e com 8 horas
# escritas ali em cima a janela virou 7h55: o `Tiat North` que nasceu as 14:12
# foi visto pelo scanner e NAO virou mensagem, porque caiu dentro da janela do
# nascimento das 06:22. Agora sao dois numeros independentes. Errar o respawn
# atrasa a previsao da janela; nao apaga mais um aviso.
#
# O PADRAO E 25 MINUTOS e voce provavelmente nunca precisa mexer nisto. Ele foi
# MEDIDO nos arquivos de `.agenda/` em 31/08/2026: o maior intervalo entre a
# primeira e a ultima deteccao de um mesmo nascimento foi de 12 minutos (9
# deteccoes de `Tiat North` em 30/08, das 22:17 as 22:29), e 25 e o dobro
# disso com um minuto de sobra.
#
# SE VOCE AUMENTAR MUITO, O SCANNER FICA MUDO. O programa RECUSA subir com um
# valor maior ou igual ao menor `respawn_horas_min` dos blocos acima, e diz
# qual boss e qual numero: acima desse teto a janela engole o nascimento
# SEGUINTE, que e exatamente o defeito de 31/08.
#
# SE VOCE DIMINUIR MUITO, VOLTA O SPAM. Abaixo de uns 15 minutos as deteccoes
# de um mesmo nascimento comecam a se separar e voce recebe a mesma noticia
# duas ou tres vezes.
#
# A LINHA ESTA COMENTADA porque o padrao ja vale. Descomente so para mudar.
#
# [episodio]
# minutos = 25

# ---------------------------------------------------------------------------
# MARGEM DE CRAFT — quanto sobra entre o produto e os componentes
#
# SEM NENHUM BLOCO AQUI A MARGEM SIMPLESMENTE NAO APARECE. Nao e erro e nao e
# aviso: e uma secao opcional. O modo --mercado roda a noite inteira sem
# receita nenhuma e continua respondendo "vale quanto agora?".
#
# O QUE A CONTA FAZ:
#
#   margem = (menor pedido visivel do PRODUTO x quanto a receita RENDE)
#            menos a soma de (menor pedido visivel de cada COMPONENTE x a
#            QUANTIDADE que a receita pede dele)
#
# OS DOIS LADOS SAO PEDIDOS VISIVEIS NO QUADRO, e nao transacoes. O scanner ve
# OFERTAS — o que estao PEDINDO. Ele nao ve o que foi vendido nem por quanto,
# e e por isso que a palavra "lucro" nao aparece em lugar nenhum aqui.
#
# O NUMERO E BRUTO. Ele ignora a comissao do World Exchange e ignora a chance
# de o craft falhar. As duas coisas existem, e as duas comem a margem.
#
# A CONTA USA O UNITARIO, entao ela NAO lida com lote minimo. Se o menor pedido
# de um componente for um lote de 100 e a sua receita pedir 20, quem comprar
# leva 100. A simplificacao esta escrita aqui para o numero nao fingir que ela
# nao existe.
#
# A OFERTA PODE JA TER SIDO COMPRADA. O programa nao registra desaparecimento:
# o "menor pedido de 22 minutos atras" pode ter saido ha 21. NENHUMA MARGEM
# DAQUI E ACIONAVEL SEM VOCE CONFERIR NA TELA.
#
# O PROGRAMA NAO CONHECE O CRAFTING DO JOGO. Ele nao sabe o que faz um Dragon
# Belt: ele so le numeros do quadro e faz a conta que voce escreveu. Uma
# receita errada produz um numero bem formatado e completamente falso, e a
# unica defesa e voce ter escrito a receita certo.
#
# ESCREVA O NOME DE CADA ITEM EXATAMENTE COMO ELE APARECE NA TELA, com o
# prefixo de encanto quando houver — a mesma regra da watchlist ali de cima e
# pelo mesmo motivo: cada variante e uma serie de preco INDEPENDENTE. Um nome
# que case com DUAS series quebra a margem listando as candidatas em vez de
# escolher uma; um nome que nao case com nenhuma quebra tambem, dizendo qual
# faltou. Quebrar e o desfecho certo: uma margem calculada com um buraco e um
# numero plausivel e errado.
#
# `rende` E OBRIGATORIO e nao tem padrao. Um padrao silencioso de 1 daria uma
# margem cinco vezes menor que a real para quem crafta cinco de cada vez,
# perfeitamente formatada e sem uma linha de erro em lugar nenhum. Mesma razao
# que tornou `respawn_horas_min` e `respawn_horas_max` obrigatorios.
#
# CADA COMPONENTE MOSTRA A PROPRIA IDADE no console, e a mais velha sobe para
# a linha da margem. Uma margem com um ingrediente visto hoje e outro visto ha
# uma semana nao e uma margem.
#
# UM BLOCO POR RECEITA: para uma segunda, repita o bloco inteiro.
#
# [[receita]]
# produto = "Dragon Belt"
# rende = 1
# componentes = [
#   { item = "Common Aztac", quantidade = 5 },
#   { item = "Leonard", quantidade = 20 },
# ]

# ---------------------------------------------------------------------------
# IDENTIDADE — o scanner aprendendo sozinho quem ele nao conhece
#
# Quando uma linha da party window fica varias leituras seguidas SEM casar com
# nenhuma assinatura conhecida, e com a imagem do nome ESTAVEL, o scanner grava
# a assinatura dela sozinho, sem nome. A linha continua exatamente tao calada
# quanto era: ela aparece como "Membro N" e nenhum alerta sai em nome dela.
#
# ESTA SECAO E OPCIONAL. Sem ela o scanner usa os padroes abaixo, que sao os
# valores certos para a esmagadora maioria das maquinas. Os dois numeros entram
# COMENTADOS de proposito: um numero escrito no arquivo e um numero que alguem
# vai achar que precisa ajustar.
#
#   leituras_para_aprender   quantas leituras seguidas com a imagem estavel
#                            bastam para gravar. Padrao 5, que a ~1 leitura por
#                            segundo sao ~5 segundos. Subir deixa o scanner mais
#                            desconfiado (demora mais para aprender, e uma linha
#                            que pisca nunca e gravada); descer o deixa mais
#                            afoito. Menos de 1 e recusado no arranque: com zero
#                            ele gravaria no primeiro frame, sem confirmacao
#                            nenhuma.
#
